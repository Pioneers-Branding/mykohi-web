<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Onboarding Dashboard | MyKohi</title>
    <link rel="icon" type="image/png"
        href="https://img1.wsimg.com/isteam/ip/f791d9b9-2f6c-4539-b9b3-61b4c8a8a446/Blue%20Minimalist%20Brain%20Bulb%20Logo%20Transparent.png/:/rs=w:206,h:206,cg:true,m/cr=w:206,h:206/qt=q:95">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Syne:wght@600;700;800&display=swap"
        rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Syne', 'sans-serif'],
                        mono: ['Space Grotesk', 'monospace'],
                    },
                    colors: {
                        brand: {
                            50: '#f0f9ff', 100: '#e0f2fe', 200: '#bae6fd', 300: '#7dd3fc', 400: '#38bdf8',
                            500: '#0ea5e9', 600: '#0284c7', 700: '#0369a1', 900: '#0c4a6e',
                        },
                        accent: { purple: '#8b5cf6', teal: '#14b8a6', rose: '#f43f5e' }
                    }
                }
            }
        }
    </script>
    <!-- PDF export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"
        defer></script>
    <style>
        .field {
            width: 100%;
            padding: 0.65rem 0.9rem;
            border-radius: 0.75rem;
            border: 1px solid #e2e8f0;
            background: #fff;
            outline: none;
            font-size: 0.875rem;
        }

        .field:focus {
            border-color: #0ea5e9;
            box-shadow: 0 0 0 3px #e0f2fe;
        }

        #drawer {
            transition: transform .3s ease;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: .4rem;
            padding: .5rem 1rem;
            border-radius: 9999px;
            font-size: .875rem;
            font-weight: 500;
            border: 1px solid #e2e8f0;
            background: #fff;
            transition: all .15s;
            white-space: nowrap;
        }

        .btn:hover {
            background: #f8fafc;
            border-color: #cbd5e1;
        }

        .btn-dark {
            background: #0f172a;
            color: #fff;
            border-color: #0f172a;
        }

        .btn-dark:hover {
            background: #0369a1;
            border-color: #0369a1;
        }

        .btn:disabled {
            opacity: .6;
            cursor: wait;
        }

        .btn svg {
            width: 16px;
            height: 16px;
        }

        .bar {
            transition: width .6s cubic-bezier(.16, 1, .3, 1);
        }
    </style>
</head>

<body class="bg-[#f6f8fb] text-slate-900 antialiased">

    <!-- Login -->
    <section id="login-view" class="min-h-screen flex items-center justify-center px-4">
        <form id="login-form"
            class="w-full max-w-sm bg-white border border-slate-200 shadow-xl rounded-3xl p-8 text-center">
            <img src="img/brain-bulb-logo.png" alt="MyKohi" class="h-20 mx-auto mb-4">
            <h1 class="text-2xl font-display font-bold mb-1">Onboarding Dashboard</h1>
            <p class="text-sm text-slate-500 mb-6">Admin access only</p>
            <input id="admin-key" type="password" class="field mb-3" placeholder="Admin key"
                autocomplete="current-password" required>
            <p id="login-error" class="hidden text-sm text-rose-600 mb-3"></p>
            <button id="login-btn"
                class="w-full py-3 rounded-full bg-slate-900 text-white font-semibold hover:bg-brand-700 transition-all disabled:opacity-60">Sign
                in</button>
        </form>
    </section>

    <!-- Dashboard -->
    <section id="app-view" class="hidden min-h-screen">
        <header class="bg-white/90 backdrop-blur border-b border-slate-200 sticky top-0 z-20">
            <div class="max-w-[1400px] mx-auto px-4 sm:px-6 h-16 flex items-center justify-between gap-3">
                <div class="flex items-center gap-3 min-w-0">
                    <img src="img/brain-bulb-logo.png" alt="MyKohi" class="h-10">
                    <div class="min-w-0">
                        <p class="font-display font-bold leading-tight truncate">Onboarding</p>
                        <p id="last-sync" class="text-xs text-slate-400 leading-tight truncate"></p>
                    </div>
                </div>
                <div class="flex items-center gap-2">
                    <button id="refresh-btn" class="btn" title="Refresh">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 12a9 9 0 1 1-2.64-6.36M21 3v6h-6" stroke-linecap="round"
                                stroke-linejoin="round" />
                        </svg><span class="hidden sm:inline">Refresh</span></button>
                    <button id="export-btn" class="btn hidden md:inline-flex">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M4 4h16v16H4zM4 10h16M10 4v16" stroke-linejoin="round" />
                        </svg>CSV</button>
                    <button id="report-btn" class="btn btn-dark">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M12 3v12m0 0-4-4m4 4 4-4M5 21h14" stroke-linecap="round"
                                stroke-linejoin="round" />
                        </svg><span class="hidden sm:inline">Download report</span><span
                            class="sm:hidden">PDF</span></button>
                    <button id="logout-btn" class="text-sm font-medium text-slate-500 hover:text-slate-900 px-2">Log
                        out</button>
                </div>
            </div>
        </header>

        <main class="max-w-[1400px] mx-auto px-4 sm:px-6 py-8">
            <!-- Tabs -->
            <div class="inline-flex bg-white border border-slate-200 rounded-full p-1 mb-6 shadow-sm" role="tablist"
                id="tabs"></div>

            <div class="mb-6">
                <h1 id="page-title" class="text-2xl sm:text-3xl font-display font-bold"></h1>
                <p id="page-desc" class="text-slate-500 text-sm mt-1"></p>
            </div>
            <div id="not-connected" class="hidden bg-amber-50 border border-amber-200 text-amber-900 rounded-2xl px-5 py-4 mb-6 text-sm"></div>

            <!-- Stats -->
            <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-6" id="stats"></div>

            <!-- Insights -->
            <div class="grid md:grid-cols-3 gap-4 mb-8" id="insights"></div>

            <!-- Filters -->
            <div class="bg-white border border-slate-200 rounded-2xl p-3 flex flex-col md:flex-row gap-3 mb-4">
                <div class="relative md:max-w-sm w-full">
                    <svg class="w-4 h-4 text-slate-400 absolute left-3 top-1/2 -translate-y-1/2" viewBox="0 0 24 24"
                        fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="7" />
                        <path d="m20 20-3.5-3.5" stroke-linecap="round" />
                    </svg>
                    <input id="search" type="search" class="field" style="padding-left:2.25rem"
                        placeholder="Search name, email, city…">
                </div>
                <select id="status-filter" class="field md:w-48">
                    <option value="">All statuses</option>
                </select>
                <select id="type-filter" class="field md:w-64">
                    <option value="">All practice types</option>
                </select>
                <span id="result-count" class="text-sm text-slate-500 md:ml-auto self-center px-2"></span>
            </div>

            <!-- Table -->
            <div class="bg-white border border-slate-200 rounded-2xl overflow-hidden shadow-sm">
                <div class="overflow-x-auto">
                    <table class="w-full text-sm">
                        <thead
                            class="bg-slate-50 text-left text-[11px] font-mono uppercase tracking-wider text-slate-500 border-b border-slate-200">
                            <tr id="thead-row"></tr>
                        </thead>
                        <tbody id="rows" class="divide-y divide-slate-100"></tbody>
                    </table>
                </div>
                <div id="empty" class="hidden text-center py-16">
                    <p class="text-4xl mb-3">📋</p>
                    <p id="empty-text" class="text-slate-500">No submissions match.</p>
                </div>
                <p id="loading" class="text-center text-slate-500 py-16">Loading…</p>
            </div>
        </main>
    </section>

    <!-- Detail drawer -->
    <div id="overlay" class="hidden fixed inset-0 bg-slate-900/40 backdrop-blur-[2px] z-30"></div>
    <aside id="drawer"
        class="fixed top-0 right-0 h-full w-full max-w-2xl bg-[#f6f8fb] z-40 shadow-2xl translate-x-full overflow-y-auto"
        aria-hidden="true">
        <div id="d-hero" class="relative bg-gradient-to-br from-slate-900 via-brand-700 to-accent-purple text-white">
            <button id="close-drawer"
                class="absolute top-4 right-4 w-9 h-9 rounded-full bg-white/15 hover:bg-white/25 text-xl leading-none"
                aria-label="Close">×</button>
            <div class="px-6 sm:px-8 pt-8 pb-6">
                <div class="flex items-start gap-4">
                    <div id="d-avatar"
                        class="w-14 h-14 shrink-0 rounded-2xl bg-white/15 border border-white/25 flex items-center justify-center font-display font-bold text-xl">
                    </div>
                    <div class="min-w-0 pr-8">
                        <h2 id="d-title" class="text-2xl font-display font-bold leading-tight break-words"></h2>
                        <p id="d-sub" class="text-white/75 text-sm mt-1"></p>
                        <div id="d-pill" class="mt-3"></div>
                    </div>
                </div>
                <div class="flex flex-wrap gap-2 mt-6" id="d-actions"></div>
            </div>
        </div>

        <div class="p-6 sm:p-8 space-y-5">
            <div id="d-facts" class="grid grid-cols-2 sm:grid-cols-3 gap-3"></div>
            <div id="d-sections" class="space-y-5"></div>

            <div class="bg-white border border-slate-200 rounded-2xl p-5">
                <h3 class="text-xs font-mono uppercase tracking-wider text-slate-500 mb-4">Internal tracking</h3>
                <div class="grid sm:grid-cols-3 gap-4">
                    <div>
                        <label class="text-sm font-medium text-slate-700" for="d-status">Status</label>
                        <select id="d-status" class="field mt-1"></select>
                    </div>
                    <div class="sm:col-span-2">
                        <label class="text-sm font-medium text-slate-700" for="d-notes">Internal notes</label>
                        <textarea id="d-notes" rows="3" class="field mt-1"
                            placeholder="Call notes, next steps…"></textarea>
                    </div>
                </div>
                <div class="flex items-center gap-3 mt-4">
                    <button id="d-save" class="btn btn-dark">Save changes</button>
                    <span id="d-saved" class="text-sm text-slate-500"></span>
                </div>
            </div>
        </div>
    </aside>

    <script>
        // Paste the Apps Script Web app URL here (see google-apps-script/onboarding.gs).
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycby2p6fvchGt4rJAux4uMa70lF5MMLdI_cv8WjrfxV2algyZz0oGm_mm5dZEx4ApTHQ0/exec';

        const LABELS = {
            // Practice onboarding
            practice_name: 'Practice name', website: 'Website', practice_type: 'Practice type',
            years_in_operation: 'Years in operation', city: 'City', state: 'State',
            num_locations: 'Locations', num_providers: 'Providers',
            full_name: 'Full name', role: 'Role', email: 'Email', phone: 'Phone',
            preferred_contact: 'Preferred contact', best_time: 'Best time to reach',
            services_offered: 'Services offered', monthly_new_patients: 'New patients / month',
            payment_model: 'Payment model', current_marketing: 'Current marketing', challenges: 'Biggest challenge',
            interested_in: 'Interested in', monthly_budget: 'Monthly budget', timeline: 'Start timeline',
            goals: '12-month goals', referral_source: 'Heard about us via', consent: 'Consent to contact',
            source_page: 'Came from page', status: 'Status', admin_notes: 'Internal notes',
            // Access & assets
            business_name: 'Business name', brand_assets_link: 'Brand files', brand_assets_included: 'Files included',
            brand_colors: 'Brand colors', website_platform: 'Website platform', hosting_provider: 'Hosting company',
            domain_registrar: 'Domain registrar', ssl_managed_by: 'SSL managed by', website_backups: 'Website backups',
            google_products: 'Google products', google_one_login: 'One Google account?', google_account_email: 'Google account owner',
            social_platforms: 'Social platforms', facebook_url: 'Facebook page', instagram_handle: 'Instagram',
            linkedin_url: 'LinkedIn page', instagram_connected_to_facebook: 'Instagram linked to Facebook',
            other_social_links: 'Other profiles', anything_else: 'Anything else', help_call: 'Wants a help call',
            help_call_time: 'Best time for call', no_passwords_confirmed: 'Confirmed no passwords', access_summary: 'Access summary'
        };
        const TASKS = {
            access_wordpress: 'WordPress admin', access_website_builder: 'Website builder', access_hosting: 'Hosting / cPanel',
            access_domain: 'Domain & DNS', access_gbp: 'Google Business Profile', access_ga4: 'Google Analytics',
            access_gsc: 'Search Console', access_google_ads: 'Google Ads', access_gtm: 'Tag Manager',
            access_youtube: 'YouTube', access_merchant: 'Merchant Center', access_meta: 'Facebook & Instagram',
            access_linkedin: 'LinkedIn page', access_other_social: 'Other social'
        };
        const TASK_KEYS = Object.keys(TASKS);
        Object.assign(LABELS, TASKS);
        const TASK_STYLE = {
            'Done': { cls: 'bg-teal-50 text-teal-700 border-teal-200', fg: [15, 118, 110], order: 2 },
            'Need help': { cls: 'bg-rose-50 text-rose-700 border-rose-200', fg: [190, 18, 60], order: 0 },
            'Will do later': { cls: 'bg-amber-50 text-amber-700 border-amber-200', fg: [180, 83, 9], order: 1 },
            'Not applicable': { cls: 'bg-slate-100 text-slate-500 border-slate-200', fg: [100, 116, 139], order: 3 }
        };
        const HIDDEN = /recaptcha|captcha|^_/i;

        const STATUS = {
            'New': { cls: 'bg-brand-50 text-brand-700 border-brand-200', dot: 'bg-brand-500', fg: [3, 105, 161], bg: [224, 242, 254] },
            'Contacted': { cls: 'bg-amber-50 text-amber-700 border-amber-200', dot: 'bg-amber-500', fg: [180, 83, 9], bg: [254, 243, 199] },
            'In Progress': { cls: 'bg-violet-50 text-violet-700 border-violet-200', dot: 'bg-violet-500', fg: [109, 40, 217], bg: [237, 233, 254] },
            'Onboarded': { cls: 'bg-teal-50 text-teal-700 border-teal-200', dot: 'bg-teal-500', fg: [15, 118, 110], bg: [204, 251, 241] },
            'Not a Fit': { cls: 'bg-slate-100 text-slate-500 border-slate-200', dot: 'bg-slate-400', fg: [100, 116, 139], bg: [241, 245, 249] }
        };
        const URGENCY = { 'Immediately': 'bg-rose-500', 'Within 30 days': 'bg-amber-500', '1–3 months': 'bg-brand-500', 'Just exploring': 'bg-slate-300' };
        const AVATAR_COLORS = ['bg-brand-100 text-brand-700', 'bg-violet-100 text-violet-700', 'bg-teal-100 text-teal-700', 'bg-amber-100 text-amber-700', 'bg-rose-100 text-rose-700', 'bg-indigo-100 text-indigo-700'];
        const ICONS = {
            list: '<path d="M9 4H6v17h12V4h-3M9 3h6v3H9zM9 11h6M9 15h4" stroke-linecap="round" stroke-linejoin="round"/>',
            calendar: '<path d="M4 7h16v13H4zM4 11h16M9 3v4M15 3v4" stroke-linejoin="round"/>',
            clock: '<path d="M12 7v5l3 2M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0z" stroke-linecap="round"/>',
            check: '<path d="m5 12 4 4L19 7" stroke-linecap="round" stroke-linejoin="round"/>',
            help: '<path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.7M12 17h.01M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0z" stroke-linecap="round"/>',
            folder: '<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" stroke-linejoin="round"/>',
        };
        const ACCENTS = { slate: 'from-slate-800 to-slate-600', brand: 'from-brand-600 to-brand-400', amber: 'from-amber-500 to-orange-400', teal: 'from-teal-500 to-emerald-400', rose: 'from-rose-500 to-pink-400', violet: 'from-violet-500 to-accent-purple' };

        const $ = id => document.getElementById(id);
        let adminKey = '';
        let statuses = Object.keys(STATUS);
        let active = null;
        let current = 'onboarding';
        const data = {};   // source -> { rows, connected }

        try { adminKey = sessionStorage.getItem('mykohi_admin_key') || ''; } catch (e) { }
        try { current = localStorage.getItem('mykohi_dash_tab') || current; } catch (e) { }

        function esc(s) {
            return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        }

        async function api(action, extra = {}) {
            if (SCRIPT_URL.startsWith('PASTE_')) throw new Error('SCRIPT_URL is not set in admin-dashboard.html');
            const res = await fetch(SCRIPT_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({ action, key: adminKey, ...extra })
            });
            const json = await res.json();
            if (!json.ok) throw new Error(json.error || 'Request failed');
            return json;
        }

        // ---------- Field helpers (tolerate Formester header variations) ----------
        const norm = s => String(s).toLowerCase().replace(/[^a-z0-9]/g, '');
        function headerFor(row, key) {
            if (key in row.fields) return key;
            return Object.keys(row.fields).find(h => norm(h) === norm(key)) || null;
        }
        function get(row, key) {
            const h = headerFor(row, key);
            return h ? String(row.fields[h]).trim() : '';
        }
        const list = v => String(v || '').split(',').map(s => s.trim()).filter(Boolean);
        const loc = r => [get(r, 'city'), get(r, 'state')].filter(Boolean).join(', ');
        const host = u => String(u || '').replace(/^https?:\/\//i, '').replace(/^www\./i, '').replace(/\/$/, '');
        function dateKey(row) {
            return Object.keys(row.fields).find(h => /submitted|created|timestamp|date|time/i.test(h) && !/best_?time|timeline|call_?time/i.test(h));
        }
        function dateOf(row) {
            const k = dateKey(row);
            if (!k) return null;
            const d = new Date(row.fields[k]);
            return isNaN(d) ? null : d;
        }
        const fmtDate = d => d ? d.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' }) : '—';
        function timeAgo(d) {
            if (!d) return '';
            const s = (Date.now() - d.getTime()) / 1000;
            if (s < 3600) return Math.max(1, Math.round(s / 60)) + 'm ago';
            if (s < 86400) return Math.round(s / 3600) + 'h ago';
            if (s < 86400 * 30) return Math.round(s / 86400) + 'd ago';
            return fmtDate(d);
        }
        function labelFor(k) {
            return LABELS[k] || LABELS[Object.keys(LABELS).find(l => norm(l) === norm(k))]
                || k.replace(/[_-]+/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
        }
        function initials(name) {
            const parts = String(name || '?').trim().split(/\s+/).filter(w => /^[a-z0-9]/i.test(w));
            return ((parts[0] || '?')[0] + (parts[1] ? parts[1][0] : '')).toUpperCase();
        }
        function avatarColor(s) {
            let h = 0;
            for (const c of String(s)) h = (h * 31 + c.charCodeAt(0)) >>> 0;
            return AVATAR_COLORS[h % AVATAR_COLORS.length];
        }
        const pill = s => `<span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full border text-xs font-medium whitespace-nowrap ${(STATUS[s] || STATUS.New).cls}"><span class="w-1.5 h-1.5 rounded-full ${(STATUS[s] || STATUS.New).dot}"></span>${esc(s)}</span>`;
        const chip = (t, extra = '') => `<span class="inline-block px-2.5 py-1 rounded-full bg-slate-100 text-slate-700 text-xs font-medium ${extra}">${esc(t)}</span>`;
        const taskBadge = v => `<span class="inline-block px-2.5 py-1 rounded-full border text-xs font-semibold whitespace-nowrap ${(TASK_STYLE[v] || TASK_STYLE['Not applicable']).cls}">${esc(v)}</span>`;
        function counts(items, key, multi) {
            const m = new Map();
            items.forEach(r => (multi ? list(get(r, key)) : [get(r, key)]).filter(v => v && v !== 'None').forEach(v => m.set(v, (m.get(v) || 0) + 1)));
            return [...m.entries()].sort((a, b) => b[1] - a[1]);
        }
        function tally(values) {
            const m = new Map();
            values.forEach(v => m.set(v, (m.get(v) || 0) + 1));
            return [...m.entries()].sort((a, b) => b[1] - a[1]);
        }
        const weekAgo = () => Date.now() - 7 * 864e5;
        const thisWeek = items => items.filter(r => { const d = dateOf(r); return d && d.getTime() >= weekAgo(); }).length;

        function tasksOf(row) {
            const all = TASK_KEYS.map(k => [k, get(row, k)]).filter(([, v]) => v);
            const rel = all.filter(([, v]) => v !== 'Not applicable');
            return {
                all, total: rel.length,
                done: rel.filter(x => x[1] === 'Done').length,
                help: rel.filter(x => x[1] === 'Need help').map(x => TASKS[x[0]]),
                later: rel.filter(x => x[1] === 'Will do later').map(x => TASKS[x[0]]),
            };
        }

        // Shared table cells
        const nameCell = (name, sub) => `
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 shrink-0 rounded-xl ${avatarColor(name)} flex items-center justify-center font-bold text-sm">${esc(initials(name))}</div>
                <div class="min-w-0">
                    <div class="font-semibold text-slate-900 truncate max-w-[240px]">${esc(name)}</div>
                    <div class="text-xs text-slate-500 truncate max-w-[240px]">${esc(sub)}</div>
                </div>
            </div>`;
        const twoLine = (a, b) => `<div class="text-slate-800">${esc(a)}</div><div class="text-xs text-slate-500">${esc(b)}</div>`;
        const chipList = (items, cls = '', max = 2) => `<div class="flex flex-wrap gap-1 max-w-[260px]">${items.slice(0, max).map(i => chip(i, cls)).join('')}${items.length > max ? chip('+' + (items.length - max), 'bg-slate-200') : ''}</div>`;

                                <div class="h-1.5 rounded-full bg-slate-100 overflow-hidden"><div class="h-full rounded-full ${pct === 100 ? 'bg-teal-500' : 'bg-brand-500'}" style="width:${pct}%"></div></div></div>`;

        const src = () => SOURCES[current];

        const nameOf = r => get(r, src().nameKey) || 'Untitled ' + src().noun;

        // ---------- Auth & loading ----------
        async function login(key) {
            adminKey = key;
            await api('login');
            try { sessionStorage.setItem('mykohi_admin_key', key); } catch (e) { }
            $('login-view').classList.add('hidden');
            $('app-view').classList.remove('hidden');
            switchTab(SOURCES[current] ? current : 'onboarding', true);
        }

        async function load(source = current) {
            if (source === current) {
                $('loading').classList.remove('hidden');
                $('loading').textContent = 'Loading…';
                $('rows').innerHTML = '';
                $('empty').classList.add('hidden');
            }
            $('refresh-btn').disabled = true;
            try {
                const res = await api('list', { source });
                statuses = res.statuses || statuses;
                // An older script ignores `source` and always returns onboarding rows.
                const connected = source === 'onboarding' ? true : res.connected === true;
                data[source] = { rows: connected ? res.rows : [], connected };
                if (source === current) {
                    fillFilters();
                    render();
                    $('last-sync').textContent = 'Updated ' + new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
                    $('loading').classList.add('hidden');
                }
                renderTabs();
            } catch (err) {
                if (/unauthorized/i.test(err.message)) return logout();
                if (source === current) $('loading').textContent = 'Could not load data: ' + err.message;
            } finally {
                $('refresh-btn').disabled = false;
            }
        }

        function renderTabs() {
            $('tabs').innerHTML = Object.entries(SOURCES).map(([k, s]) => {
                const n = data[k] && data[k].connected ? data[k].rows.length : '';
                const on = k === current;
                return `<button role="tab" aria-selected="${on}" data-tab="${k}" class="px-4 sm:px-5 py-2 rounded-full text-sm font-medium transition-all ${on ? 'bg-slate-900 text-white shadow' : 'text-slate-600 hover:text-slate-900'}">${esc(s.tab)}${n !== '' ? ` <span class="ml-1 text-xs ${on ? 'text-white/70' : 'text-slate-400'}">${n}</span>` : ''}</button>`;
            }).join('');
        }

        function switchTab(key, force) {
            if (!SOURCES[key] || (key === current && !force)) return;
            current = key;
            try { localStorage.setItem('mykohi_dash_tab', key); } catch (e) { }
            closeDrawer();
            const s = src();
            $('page-title').textContent = s.title;
            $('page-desc').textContent = s.desc;
            $('search').placeholder = s.search;
            $('search').value = '';
            $('status-filter').value = '';
            $('thead-row').innerHTML = s.columns.map((c, i) => `<th class="${c.cls || 'px-4'} py-3 ${c.nowrap ? 'whitespace-nowrap' : ''}">${esc(c.th)}</th>`).join('');
            renderTabs();
            if (data[key]) { fillFilters(); render(); $('loading').classList.add('hidden'); }
            else load(key);
            // Load the other tab in the background so its count shows.
            Object.keys(SOURCES).forEach(k => { if (k !== key && !data[k]) load(k); });
        }

        function fillFilters() {
            const sf = $('status-filter'), tf = $('type-filter');
            const sv = sf.value, tv = tf.value;
            sf.innerHTML = '<option value="">All statuses</option>' + statuses.map(s => `<option>${esc(s)}</option>`).join('');
            const types = [...new Set(rowsOf().map(r => get(r, src().filterKey)).filter(Boolean))].sort();
            tf.innerHTML = `<option value="">${esc(src().filterAll)}</option>` + types.map(t => `<option>${esc(t)}</option>`).join('');
            sf.value = sv;
            tf.value = types.includes(tv) ? tv : '';
            $('d-status').innerHTML = statuses.map(s => `<option>${esc(s)}</option>`).join('');
        }

        function filtered() {
            const q = $('search').value.trim().toLowerCase();
            const st = $('status-filter').value;
            const ty = $('type-filter').value;
            return rowsOf().filter(r =>
                (!st || r.status === st) &&
                (!ty || get(r, src().filterKey) === ty) &&
                (!q || Object.values(r.fields).join(' ').toLowerCase().includes(q) || r.adminNotes.toLowerCase().includes(q))
            );
        }

        }

        function barCard(title, rows, color) {
            const top = rows.slice(0, 5);
            const max = Math.max(1, ...top.map(d => d[1]));
            const body = top.length ? top.map(([k, v]) => `
                <div>

                </div>`).join('') : '<p class="text-sm text-slate-400">No data yet</p>';
            return `<div class="bg-white border border-slate-200 rounded-2xl p-5 shadow-sm">
                <p class="text-xs font-mono uppercase tracking-wider text-slate-500 mb-4">${esc(title)}</p>
                <div class="space-y-3">${body}</div></div>`;

                <div class="bg-white border border-slate-200 rounded-2xl px-4 py-3">
                    <p class="text-[11px] font-mono uppercase tracking-wider text-slate-500">${esc(l)}</p>
                    <p class="text-base font-semibold text-slate-900 mt-0.5 truncate">${esc(v || '—')}</p>
                </div>`).join('');

            const others = otherFields(row);
            $('d-sections').innerHTML = s.sections.map(sec => sectionCard(row, sec)).join('') +
                (others.length ? `<div class="bg-white border border-slate-200 rounded-2xl p-5">
                    <h3 class="text-xs font-mono uppercase tracking-wider text-slate-500 mb-4">Additional details</h3>
                    <dl class="grid sm:grid-cols-2 gap-x-6 gap-y-4">${others.map(k => `
                        <div><dt class="text-xs text-slate-500 mb-0.5">${esc(labelFor(k))}</dt><dd class="text-sm text-slate-900 font-medium">${valueHtml(k, String(row.fields[k]))}</dd></div>`).join('')}</dl></div>` : '');

            $('d-status').value = row.status;
            $('d-notes').value = row.adminNotes;
            $('d-saved').textContent = '';

            $('drawer').scrollTop = 0;
            $('overlay').classList.remove('hidden');
            $('drawer').classList.remove('translate-x-full');
            $('drawer').setAttribute('aria-hidden', 'false');
        }

        function closeDrawer() {
            active = null;
            $('overlay').classList.add('hidden');
            $('drawer').classList.add('translate-x-full');
            $('drawer').setAttribute('aria-hidden', 'true');
        }

        async function saveActive() {
            if (!active) return;
            const row = active;
            const changes = { status: $('d-status').value, adminNotes: $('d-notes').value };
            $('d-save').disabled = true;
            $('d-saved').textContent = 'Saving…';
            try {
                await api('update', { rowKey: row.rowKey, changes });
                Object.assign(row, changes);
                render();
                $('d-pill').innerHTML = pill(row.status);
                $('d-saved').textContent = 'Saved ✓';
            } catch (err) {
                $('d-saved').textContent = 'Error: ' + err.message;
            } finally {
                $('d-save').disabled = false;
            }
        }

        // ---------- PDF export ----------
        const C = {
            ink: [15, 23, 42], muted: [100, 116, 139], line: [226, 232, 240], soft: [248, 250, 252],
            brand: [2, 132, 199], brandDark: [3, 105, 161], brandSoft: [240, 249, 255], purple: [139, 92, 246], white: [255, 255, 255]
        };
        let logoData;
        async function getLogo() {
            if (logoData !== undefined) return logoData;
            try {
                const blob = await (await fetch('img/brain-bulb-logo.png')).blob();
                logoData = await new Promise(res => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.readAsDataURL(blob); });
            } catch (e) { logoData = null; }
            return logoData;
        }
        // Built-in PDF fonts only cover Latin-1 plus a few typographic marks; drop anything else (e.g. emoji).
        const T = s => String(s ?? '').replace(/[^\t\n\r\x20-\x7E -ÿ–—‘’“”•…€]/g, '').trim();
        const slug = s => T(s).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 50) || 'record';
        const today = () => new Date().toLocaleDateString(undefined, { month: 'long', day: 'numeric', year: 'numeric' });

        function newDoc(orientation) {
            if (!window.jspdf) throw new Error('PDF library is still loading, try again in a second.');
            return new window.jspdf.jsPDF({ unit: 'pt', format: 'a4', orientation });
        }

        function gradientBar(doc, x, y, w, h) {
            const steps = 60;
            for (let i = 0; i < steps; i++) {
                const t = i / (steps - 1);
                doc.setFillColor(...C.brand.map((c, j) => Math.round(c + (C.purple[j] - c) * t)));
                doc.rect(x + (w / steps) * i, y, w / steps + 0.5, h, 'F');
            }
        }

        async function pdfHeader(doc, eyebrow, title, subtitle) {
            const W = doc.internal.pageSize.getWidth(), M = 40;
            const logo = await getLogo();
            if (logo) doc.addImage(logo, 'PNG', M, 26, 50, 50);
            const x = logo ? M + 62 : M;
            doc.setFont('helvetica', 'bold'); doc.setFontSize(8); doc.setTextColor(...C.brand);
            doc.text(T(eyebrow).toUpperCase(), x, 40, { charSpace: 1 });
            doc.setFontSize(18); doc.setTextColor(...C.ink);
            doc.text(T(title), x, 60);
            doc.setFont('helvetica', 'normal'); doc.setFontSize(9); doc.setTextColor(...C.muted);
            doc.text(T(subtitle), x, 74);
            doc.setFontSize(8);
            doc.text('Generated ' + today(), W - M, 40, { align: 'right' });
            doc.text('Confidential', W - M, 52, { align: 'right' });
            gradientBar(doc, M, 90, W - M * 2, 3);
            return 112;
        }

        function pdfFooters(doc, label) {
            const n = doc.getNumberOfPages();
            for (let i = 1; i <= n; i++) {
                doc.setPage(i);
                const W = doc.internal.pageSize.getWidth(), H = doc.internal.pageSize.getHeight(), M = 40;
                doc.setDrawColor(...C.line); doc.setLineWidth(0.5);
                doc.line(M, H - 34, W - M, H - 34);
                doc.setFont('helvetica', 'normal'); doc.setFontSize(7.5); doc.setTextColor(...C.muted);
                doc.text('MyKohi  ·  ' + label + '  ·  mykohi.com', M, H - 20);
                doc.text(`Page ${i} of ${n}`, W - M, H - 20, { align: 'right' });
            }
        }

        function statusBadge(doc, status, x, y, alignRight) {
            const s = STATUS[status] || STATUS.New;
            doc.setFont('helvetica', 'bold'); doc.setFontSize(8);
            const w = doc.getTextWidth(T(status).toUpperCase()) + 20;
            const bx = alignRight ? x - w : x;
            doc.setFillColor(...s.bg);
            doc.roundedRect(bx, y, w, 18, 9, 9, 'F');
            doc.setFillColor(...s.fg);
            doc.circle(bx + 9, y + 9, 2.2, 'F');
            doc.setTextColor(...s.fg);
            doc.text(T(status).toUpperCase(), bx + 15, y + 12.2, { charSpace: 0.3 });
        }

        // Largest font size (down to min) at which text fits maxW; ellipsize if it still doesn't.
        function fitText(doc, text, maxW, size, min) {
            for (let fs = size; fs >= min; fs -= 0.5) {
                doc.setFontSize(fs);
                if (doc.getTextWidth(text) <= maxW) return text;
            }
            let t = text;
            while (t.length > 1 && doc.getTextWidth(t + '…') > maxW) t = t.slice(0, -1);
            return t.trimEnd() + '…';
        }

        function statBoxes(doc, y, items) {
            const W = doc.internal.pageSize.getWidth(), M = 40, gap = 10;
            const bw = (W - M * 2 - gap * (items.length - 1)) / items.length, bh = 54;
            items.forEach(([label, value], i) => {
                const x = M + i * (bw + gap);
                doc.setFillColor(...C.soft); doc.setDrawColor(...C.line); doc.setLineWidth(0.6);
                doc.roundedRect(x, y, bw, bh, 8, 8, 'FD');
                doc.setFont('helvetica', 'bold'); doc.setFontSize(6.8); doc.setTextColor(...C.muted);
                doc.text(T(label).toUpperCase(), x + 12, y + 18, { charSpace: 0.6 });
                doc.setTextColor(...C.ink);
                doc.text(fitText(doc, T(value) || '-', bw - 24, 13, 8.5), x + 12, y + 38);
            });
            return y + bh;
        }

        async function profilePdf(row) {
            const s = src();
            const doc = newDoc('portrait');
            const W = doc.internal.pageSize.getWidth(), H = doc.internal.pageSize.getHeight(), M = 40;
            const name = nameOf(row);
            let y = await pdfHeader(doc, s.profile.eyebrow, 'MyKohi Onboarding', 'Prepared for the MyKohi team');

            // Hero
            doc.setFont('helvetica', 'bold'); doc.setFontSize(22); doc.setTextColor(...C.ink);
            const nameLines = doc.splitTextToSize(T(name), W - M * 2 - 130);
            doc.text(nameLines, M, y + 10);
            statusBadge(doc, row.status, W - M, y - 4, true);
            y += 10 + (nameLines.length - 1) * 24 + 18;
            doc.setFont('helvetica', 'normal'); doc.setFontSize(10.5); doc.setTextColor(...C.muted);
            const d = dateOf(row);
            doc.text(T([s.sub(row), d ? 'Submitted ' + fmtDate(d) : ''].filter(Boolean).join('   ·   ')), M, y);
            y += 22;

            const facts = s.facts(row);
            y = statBoxes(doc, y, facts.slice(0, 3)) + 10;
            y = statBoxes(doc, y, facts.slice(3)) + 24;

            const section = (title, pairs) => {
                if (!pairs.length) return;
                // Start short sections on a new page rather than splitting them.
                if (pairs.length <= 8 && y + 34 + pairs.length * 26 > H - 50) { doc.addPage(); y = 50; }
                doc.autoTable({
                    rowPageBreak: 'avoid',
                    startY: y,
                    margin: { left: M, right: M, top: 50, bottom: 50 },
                    head: [[{ content: T(title).toUpperCase(), colSpan: 2 }]],
                    body: pairs.map(([k, v]) => [T(labelFor(k)), T(v)]),
                    theme: 'plain',
                    styles: { font: 'helvetica', fontSize: 9.5, cellPadding: { top: 7, bottom: 7, left: 10, right: 10 }, textColor: C.ink, lineColor: C.line, overflow: 'linebreak', valign: 'top' },
                    headStyles: { fillColor: C.brandSoft, textColor: C.brandDark, fontStyle: 'bold', fontSize: 8, cellPadding: { top: 8, bottom: 8, left: 10, right: 10 } },
                    columnStyles: { 0: { cellWidth: 150, textColor: C.muted }, 1: { fontStyle: 'normal' } },
                    alternateRowStyles: { fillColor: C.soft },
                    tableLineWidth: 0.6, tableLineColor: C.line,
                    didParseCell: data => {
                        const st = TASK_STYLE[data.cell.raw];
                        if (data.section === 'body' && data.column.index === 1 && st) {
                            data.cell.styles.textColor = st.fg;
                            data.cell.styles.fontStyle = 'bold';
                        }
                    },
                });
                y = doc.lastAutoTable.finalY + 18;
            };

            s.sections.forEach(sec => section(sec.title, sectionPairs(row, sec)));
            section('Additional details', otherFields(row).map(k => [k, String(row.fields[k])]));
            section('Internal tracking', [['status', row.status], ['admin_notes', row.adminNotes || '-']]);

            pdfFooters(doc, s.profile.eyebrow);
            doc.save(`MyKohi-${s.profile.file}-${slug(name)}.pdf`);
        }

        function barsPanel(doc, x, y, w, title, rows) {
            const top = rows.slice(0, 5), max = Math.max(1, ...top.map(d => d[1]));
            doc.setFillColor(...C.white); doc.setDrawColor(...C.line); doc.setLineWidth(0.6);
            doc.roundedRect(x, y, w, 128, 8, 8, 'FD');
            doc.setFont('helvetica', 'bold'); doc.setFontSize(7); doc.setTextColor(...C.muted);
            doc.text(T(title).toUpperCase(), x + 12, y + 18, { charSpace: 0.6 });
            if (!top.length) {
                doc.setFont('helvetica', 'normal'); doc.setFontSize(9); doc.text('No data yet', x + 12, y + 40);
                return;
            }
            top.forEach(([k, v], i) => {
                const ry = y + 34 + i * 18.5, labelW = w * 0.42, barW = w - labelW - 50;
                doc.setFont('helvetica', 'normal'); doc.setFontSize(8.5); doc.setTextColor(...C.ink);
                doc.text(fitText(doc, T(k), labelW - 8, 8.5, 8.5), x + 12, ry + 7);
                doc.setFillColor(...C.soft); doc.roundedRect(x + 12 + labelW, ry, barW, 8, 4, 4, 'F');
                doc.setFillColor(...C.brand); doc.roundedRect(x + 12 + labelW, ry, Math.max(8, barW * v / max), 8, 4, 4, 'F');
                doc.setFont('helvetica', 'bold');
                doc.text(String(v), x + w - 12, ry + 7, { align: 'right' });
            });
        }

        async function reportPdf() {
            const s = src(), rep = s.report;
            const items = filtered();
            const doc = newDoc('landscape');
            const W = doc.internal.pageSize.getWidth(), M = 40;
            const filters = [$('search').value.trim() && `search "${$('search').value.trim()}"`, $('status-filter').value, $('type-filter').value].filter(Boolean);
            let y = await pdfHeader(doc, rep.eyebrow, rep.title,
                `${items.length} ${s.noun}${items.length === 1 ? '' : 's'}${filters.length ? '  ·  Filtered by ' + filters.join(', ') : '  ·  All submissions'}`);

            y = statBoxes(doc, y, s.stats(items).map(c => [c.label, String(c.pdf ?? c.value)])) + 14;

            const pw = (W - M * 2 - 20) / 3;
            s.insights(items).forEach(([title, rows], i) => barsPanel(doc, M + i * (pw + 10), y, pw, title, rows));
            y += 128 + 20;

            const cols = rep.columns;
            const statusCol = cols.findIndex(c => c.head === 'Status');
            const columnStyles = {};
            cols.forEach((c, i) => { if (c.width) columnStyles[i] = { cellWidth: c.width }; });
            doc.autoTable({
                startY: y,
                rowPageBreak: 'avoid',
                margin: { left: M, right: M, top: 50, bottom: 50 },
                head: [cols.map(c => c.head)],
                // First column holds name + subtitle so the row height accounts for both; it is drawn by hand below.
                body: items.map(r => cols.map((c, i) => i === 0 ? [T(nameOf(r)), T(s.pdfSub(r))].filter(Boolean).join('\n') : T(c.value(r)))),
                theme: 'plain',
                styles: { font: 'helvetica', fontSize: 8, textColor: C.ink, cellPadding: { top: 7, bottom: 7, left: 7, right: 7 }, lineColor: C.line, lineWidth: { bottom: 0.5 }, valign: 'middle', overflow: 'linebreak' },
                headStyles: { fillColor: C.ink, textColor: C.white, fontStyle: 'bold', fontSize: 7.5, lineWidth: 0 },
                alternateRowStyles: { fillColor: C.soft },
                columnStyles: Object.assign(columnStyles, { 0: Object.assign({ fontStyle: 'bold' }, columnStyles[0]) }),
                didParseCell: data => {
                    if (data.section === 'body' && data.column.index === statusCol) {
                        data.cell.styles.textColor = (STATUS[data.cell.raw] || STATUS.New).fg;
                        data.cell.styles.fontStyle = 'bold';
                    }
                },
                willDrawCell: data => {
                    if (data.section === 'body' && data.column.index === 0) data.cell.text = [];
                },
                didDrawCell: data => {
                    if (data.section !== 'body' || data.column.index !== 0) return;
                    const r = items[data.row.index], cell = data.cell;
                    const w = cell.width - cell.padding('horizontal');
                    doc.setFont('helvetica', 'bold'); doc.setFontSize(8);
                    const nameLines = doc.splitTextToSize(T(nameOf(r)), w);
                    doc.setFont('helvetica', 'normal'); doc.setFontSize(7.5);
                    const sub = T(s.pdfSub(r));
                    const subLines = sub ? doc.splitTextToSize(sub, w) : [];
                    const lh = 8 * 1.15, th = 7.5 * 1.15;
                    let ty = cell.y + (cell.height - (nameLines.length * lh + subLines.length * th + (subLines.length ? 2 : 0))) / 2;
                    doc.setFont('helvetica', 'bold'); doc.setFontSize(8); doc.setTextColor(...C.ink);
                    doc.text(nameLines, cell.x + cell.padding('left'), ty, { baseline: 'top', lineHeightFactor: 1.15 });
                    ty += nameLines.length * lh + 2;
                    doc.setFont('helvetica', 'normal'); doc.setFontSize(7.5); doc.setTextColor(...C.muted);
                    if (subLines.length) doc.text(subLines, cell.x + cell.padding('left'), ty, { baseline: 'top', lineHeightFactor: 1.15 });
                },
            });

            pdfFooters(doc, rep.footer);
            doc.save(`MyKohi-${rep.file}-${new Date().toISOString().slice(0, 10)}.pdf`);
        }

        async function withBusy(btn, fn) {
            const html = btn.innerHTML;
            btn.disabled = true;
            btn.textContent = 'Preparing PDF…';
            try { await fn(); }
            catch (err) { alert('Could not create PDF: ' + err.message); }
            finally { btn.disabled = false; btn.innerHTML = html; }
        }

        // ---------- CSV ----------
        function exportCsv() {
            const items = filtered();
            const headers = [...new Set(items.flatMap(r => Object.keys(r.fields)))].filter(h => !HIDDEN.test(h));
            const cell = v => {
                let s = String(v ?? '');
                if (/^[=+\-@]/.test(s)) s = "'" + s;
                return '"' + s.replace(/"/g, '""') + '"';
            };
            const lines = [[...headers, 'status', 'admin_notes'].map(cell).join(',')]
                .concat(items.map(r => [...headers.map(h => r.fields[h]), r.status, r.adminNotes].map(cell).join(',')));
            const blob = new Blob(['﻿' + lines.join('\n')], { type: 'text/csv;charset=utf-8' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `mykohi-${current}-${new Date().toISOString().slice(0, 10)}.csv`;
            a.click();
            URL.revokeObjectURL(a.href);
        }

        function logout() {
            adminKey = '';
            try { sessionStorage.removeItem('mykohi_admin_key'); } catch (e) { }
            $('app-view').classList.add('hidden');
            $('login-view').classList.remove('hidden');
            closeDrawer();
        }

        // ---------- Events ----------
        $('login-form').addEventListener('submit', async e => {
            e.preventDefault();
            const btn = $('login-btn');
            btn.disabled = true; btn.textContent = 'Checking…';
            $('login-error').classList.add('hidden');
            try {
                await login($('admin-key').value.trim());
            } catch (err) {
                adminKey = '';
                $('login-error').textContent = /unauthorized/i.test(err.message) ? 'Wrong admin key.' : err.message;
                $('login-error').classList.remove('hidden');
            } finally {
                btn.disabled = false; btn.textContent = 'Sign in';
            }
        });

        $('tabs').addEventListener('click', e => {
            const b = e.target.closest('[data-tab]');
            if (b) switchTab(b.dataset.tab);
        });
        $('rows').addEventListener('click', e => {
            if (e.target.closest('a')) return;   // links inside a row open normally
            const tr = e.target.closest('tr[data-key]');
            if (tr) openDrawer(rowsOf().find(r => r.rowKey === tr.dataset.key));
        });
        $('rows').addEventListener('keydown', e => {
            if (e.key === 'Enter') e.target.closest('tr[data-key]')?.click();
        });
        ['search', 'status-filter', 'type-filter'].forEach(id => $(id).addEventListener('input', renderTable));
        $('refresh-btn').addEventListener('click', () => load());
        $('export-btn').addEventListener('click', exportCsv);
        $('report-btn').addEventListener('click', e => withBusy(e.currentTarget, reportPdf));
        $('logout-btn').addEventListener('click', logout);
        $('close-drawer').addEventListener('click', closeDrawer);
        $('overlay').addEventListener('click', closeDrawer);
        $('d-save').addEventListener('click', saveActive);
        document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDrawer(); });

        if (adminKey) login(adminKey).catch(logout);
    </script>
</body>
